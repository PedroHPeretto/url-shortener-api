name: CD Pipeline - VM Kubernetes

on:
  workflow_run:
    workflows: [ 'CI Pipeline']
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to K3s
    runs-on: self-hosted

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Login on Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/url-shortener-api:latest

      - name: Update Kubernetes Cluster
        run: |
          cd k8s

          kubectl apply -f configmap.yaml
          kubectl apply -f secret.yaml
          kubectl apply -f deployment.yaml

          kubectl rollout restart deployment/url-shortener-api
          kubectl rollout status deployment/url-shortener-api